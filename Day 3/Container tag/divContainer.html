<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- div container is also known as bloxk level element,by default it takes 100% of the width -->
    <div style="background-color: blueviolet; width: 250px;">
        <h2>Books</h2>
        <p>This is a box of Books.</p>
        <button>Buy Now</button>
    </div>
    <div style="background-color: coral; width:250px;">
        <h2>Fruits</h2>
        <p>This is a box of Fruits.</p>
        <button>Add To Cart</button>
    </div>

    <!-- span tag - it will only take required amount of size as per my content -->

    <p>Good Evening,How are you?</p>
    <p>Good <span style="background-color: aqua;">Morning</span>, How are you doing? </p>
    <button>Cart 0</button>
    <button>Cart <span style="background-color: burlywood;">0</span></button>
</body>
</html>
